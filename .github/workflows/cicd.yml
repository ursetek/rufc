name: CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  commits:
    name: Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-chlog
        run: cargo install cargo-chlog
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}
      - name: Lint commit messages
        run: cargo chlog check --since origin/${{ github.base_ref }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ check, deny, commits ]
    if: |
      always()
      && github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs.check.result == 'success'
      && needs.deny.result == 'success'
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Extract crate name and version
        id: meta
        run: |
          NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already on crates.io
        id: check
        run: |
          NAME="${{ steps.meta.outputs.name }}"
          VERSION="${{ steps.meta.outputs.version }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/${NAME}/${VERSION}")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.check.outputs.exists == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Install cargo-chlog
        if: steps.check.outputs.exists == 'false' && false  # TODO: fix cargo-chlog and remove ` && false`
        run: cargo install cargo-chlog

      - name: Generate release notes
        if: steps.check.outputs.exists == 'false' && false  # TODO: fix cargo-chlog and remove ` && false`
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            cargo chlog log > RELEASE_NOTES.md
          else
            cargo chlog log --since "$PREV_TAG" > RELEASE_NOTES.md
          fi
          echo "path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.meta.outputs.version }}"
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
